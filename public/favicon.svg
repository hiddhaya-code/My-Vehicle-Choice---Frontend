<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Charcoal Black Circular Base -->
  <circle cx="32" cy="32" r="30" fill="#171717" stroke="#B9975B" stroke-width="2"/>
  
  <!-- Geometric M and Road Emblem in Champagne Gold -->
  <g fill="none" stroke="#B9975B" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Outer Pillar of 'M' -->
    <path d="M16 46V18L26 36" stroke-width="3.5"/>
    <!-- Right Outer Pillar of 'M' -->
    <path d="M48 46V18L38 36" stroke-width="3.5"/>
    
    <!-- Central Converging Perspective Road -->
    <path d="M22 46L30 32H34L42 46" stroke-width="2.5" fill="#B9975B" fill-opacity="0.15"/>
    
    <!-- Horizon Horizon / Road Center Lane Dashes -->
    <line x1="32" y1="44" x2="32" y2="40" stroke-width="2.5"/>
    <line x1="32" y1="37" x2="32" y2="34" stroke-width="2"/>
    <circle cx="32" cy="24" r="2" fill="#B9975B"/>
  </g>
